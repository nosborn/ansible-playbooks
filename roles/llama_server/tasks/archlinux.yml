---
- name: install package
  community.general.pacman:
    name:
      - ggml-cpu
      - ggml-cuda
      - llama-cpp
    state: present

- ansible.builtin.file:
    path: /etc/systemd/system/llama-server.service.d
    owner: root
    group: root
    mode: !!str 0755
    state: directory

- name: configure service
  ansible.builtin.copy:
    content: |
      [Service]
      Environment=LLAMA_API_KEY={{ llama_api_key }}
      ; Environment=LLAMA_ARG_CTX_SIZE=4096
      Environment=LLAMA_ARG_HOST=0.0.0.0
      Environment=LLAMA_ARG_MODEL=/usr/share/llama/models/Jackrong/Qwen3.5-9B-DeepSeek-V4-Flash-Q4_K_M.gguf
      Environment=LLAMA_ARG_PORT=9931
    dest: /etc/systemd/system/llama-server.service.d/override.conf
    owner: root
    group: root
    mode: !!str 0400
  notify: restart llama-server

- name: enable and start service
  ansible.builtin.systemd:
    name: llama-server.service
    daemon_reload: true
    enabled: true
    state: started
